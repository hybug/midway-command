<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中途岛指挥官</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=1780997995">
</head>
<body>

<div id="app">

  <!-- ═══ Top Bar ═══ -->
  <header id="topbar" class="paper-topbar">
    <div class="topbar-left">
      <img class="topbar-flag-img" src="/static/assets/ui/flag48.svg" alt="US">
      <span class="topbar-title">中途岛指挥官</span>
      <span class="topbar-subtitle">TASK FORCE 16</span>
    </div>
    <div class="topbar-center">
      <span class="topbar-date">04 JUN 1942 · Z+12</span>
      <span class="topbar-clock" id="clock">04:00<span class="topbar-clock-suffix"> Z</span></span>
    </div>
    <div class="topbar-right">
      <span class="topbar-ap">ACTION POINTS: <span class="topbar-ap-val" id="ap-current">3</span>/<span class="topbar-ap-val" id="ap-max">3</span></span>
    </div>
  </header>

  <!-- ═══ Main Chart Area ═══ -->
  <main id="chart-area">
    <div class="chart-light" aria-hidden="true"></div>
    <div class="chart-scratches" aria-hidden="true"></div>
    <div class="chart-label">海图（CHART）</div>
    <canvas id="tacticalMap"></canvas>
  </main>

  <!-- ═══ Bottom Dashboard + Controls ═══ -->
  <div id="bottom">
    <div id="dashboard">
      <div class="dash-item"><span class="dash-label">航向</span><span class="dash-val" id="d-course">240°</span></div>
      <div class="dash-item"><span class="dash-label">航速</span><span class="dash-val" id="d-speed">25 KTS</span></div>
      <div class="dash-item"><span class="dash-label">位置</span><span class="dash-val" id="d-pos">32°0'N 175°0'W</span></div>
      <div class="dash-item"><span class="dash-label">损伤</span><span class="dash-val" id="d-dmg">OK</span></div>
      <div class="dash-item"><span class="dash-label">甲板</span><span class="dash-val" id="d-deck">—</span></div>
      <div class="dash-item"><span class="dash-label">巡逻</span><span class="dash-val" id="d-cap">0 CAP</span></div>
      <div class="dash-item"><span class="dash-label">侦察</span><span class="dash-val" id="d-scout">无</span></div>
      <div class="dash-item"><span class="dash-label">敌情</span><span class="dash-val" id="d-enemy">暂无</span></div>
    </div>
    <div id="controls">
      <button class="btn" id="btn-advance">ADVANCE +15MIN</button>
      <button class="btn" id="btn-sitrep">SITUATION REPORT</button>
    </div>
  </div>

  <!-- ═══ Right Sidebar ═══ -->
  <aside id="sidebar">
    <div id="npc-tabs"></div>
    <div id="sidebar-content">
      <div id="chat-log"></div>
      <div id="suggestions"></div>
    </div>
    <div id="input-bar">
      <input type="text" id="chat-input" placeholder="输入指令..." autocomplete="off">
      <button class="btn btn-send" id="btn-send">发送</button>
    </div>
  </aside>

  <img class="desk-prop desk-ruler" src="/static/assets/ui/ruler_wood.svg" alt="" aria-hidden="true">
  <img class="desk-prop desk-pencil" src="/static/assets/ui/pencil.svg" alt="" aria-hidden="true">

</div>

<div id="vignette-overlay" aria-hidden="true"></div>
<div id="noise-overlay" aria-hidden="true"></div>

<script src="/static/js/svgLoader.js?v=1780997995"></script>
<script src="/static/js/chartRenderer.js?v=1780997995"></script>
<script src="/static/js/mapRenderer.js?v=1780997995"></script>
<script src="/static/js/uiController.js?v=1780997995"></script>
<script src="/static/js/main.js?v=1780997995"></script>
</body>
</html>
