<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>INTEL FIXTURE — 非游戏画面</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1780998020">
  <style>
    body { background:#3a3226; display:flex; gap:16px; padding:16px; margin:0; }
    .fx-col { width: 330px; }
    .fx-note { position:fixed; top:0; left:0; right:0; z-index:99; background:#8b2500; color:#f5edd6;
               font:11px 'Special Elite',monospace; padding:2px 8px; text-align:center; }
    #after-action { position:relative; inset:auto; background:transparent; display:block;
                    width:560px; max-height:none; }
    .aa-panel { max-height:none; }
  </style>
</head>
<body>
<div class="fx-note">FIXTURE — 非游戏画面（S2.8 情报板定妆：收报室/简报/审图/复盘）</div>

<div class="fx-col">
  <div id="intel-board"></div>
</div>

<div id="after-action">
  <div class="aa-panel">
    <header class="aa-head">
      <span class="aa-stamp">SECRET</span>
      <h2 class="aa-title">AFTER ACTION — 证据·判断·批准 因果链</h2>
      <button class="btn" id="aa-close">关闭</button>
    </header>
    <div class="aa-body" id="aa-body"></div>
  </div>
</div>

<script>

window.fetch = (path) => Promise.resolve({
  ok: true, json: () => Promise.resolve(FIX[path] || {}) });

<script src="/static/js/intelBoard.js?v=1780998020"></script>
<script>
const board = new IntelBoard();
board.mount('intel-board');
board.tab = (location.hash.match(/tab=(\w+)/) || [])[1] || 'PLOTS';
board.refresh(true);
// 定妆：直接渲染复盘弹层
setTimeout(() => board._renderAfterAction(FIX['/intel/after-action']), 50);
</script>
</body>
</html>
